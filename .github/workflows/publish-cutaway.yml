# Publishes this fork's build of the package as @bvdmitri/gyroview, for Cutaway
# to depend on until upstream releases the rendition API and the app-trim fix.
# Runs on a `cutaway-v<version>` tag of the `cutaway` branch; the tag must match
# apps/library/package.json. Needs the NPM_TOKEN secret (a granular token with
# "Read and write (publish and stage)" on the @bvdmitri scope).
name: Publish the Cutaway build

on:
  push:
    tags: ['cutaway-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check the tag names the package's version
        run: |
          version="$(node -p "require('./apps/library/package.json').version")"
          test "${GITHUB_REF_NAME}" = "cutaway-v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bubo-squared/gyroview build
      - name: Publish as @bvdmitri/gyroview
        working-directory: apps/library
        run: |
          npm pkg set name=@bvdmitri/gyroview \
            repository.url=git+https://github.com/bvdmitri/GyroView.git \
            homepage=https://github.com/bvdmitri/GyroView/tree/cutaway#readme \
            bugs=https://github.com/bvdmitri/GyroView/issues
          npm publish --access public --tag cutaway
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
